{% extends 'base.html' %}

{% block content %}

<h1>Step 1: How many voucher do you want to generate?</h1>

<div class="section">
    <form action="pdf/step" method="POST">
        <div>
            <label for="roll">Roll</label>
            <input name="roll" id="roll" value="{{ next_roll }}" min="0" max="65535" type="number" required>
            <div class="hint">
                {% if last_roll is not none %}
                Last generated roll: {{ last_roll }}. Only change the roll to reprint an existing one.
                {% else %}
                No roll has been generated yet.
                {% endif %}
            </div>
        </div>
        <div>
            <label for="count">Count </label>
            <input name="count" id="count" value="200" min=4 type="number">
        </div>
        <div>
            <input type="submit" value="Next">
        </div>
    </form>
</div>
{% endblock %}
